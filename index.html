<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر التمرين</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11151B">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر التمرين">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#11151B; --panel:#191F28; --panel2:#1F2733; --line:#2B3542;
  --chalk:#E9ECF1; --dim:#8B94A5; --brass:#D6A344; --up:#57C08C; --down:#C97070;
  --muscle:#333E4D; --rad:14px;
  --ar:'Tajawal','Noto Kufi Arabic','Segoe UI',system-ui,sans-serif;
  --num:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:var(--ar);line-height:1.55;padding:0 0 96px}
.wrap{max-width:700px;margin:0 auto;padding:0 14px}
button{font-family:var(--ar)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

header{position:sticky;top:0;z-index:20;background:rgba(17,21,27,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.htop{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.brand{font-weight:900;font-size:19px;margin-left:auto}
.brand span{color:var(--brass)}
.saved{font-size:11px;color:var(--up);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.dateBox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.dateBox input{background:none;border:0;color:var(--chalk);font-family:var(--ar);font-size:13px;outline:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.tab.on{background:var(--brass);border-color:var(--brass);color:#171208}

.strip{display:flex;align-items:baseline;gap:8px;padding:14px 0 2px}
.strip .big{font-family:var(--num);font-size:34px;font-weight:700;letter-spacing:-1px}
.strip .lbl{font-size:12px;color:var(--dim)}
.strip .delta{margin-right:auto;font-size:12px;font-weight:700;color:var(--dim)}
.delta.up{color:var(--up)} .delta.down{color:var(--down)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);margin:12px 0;overflow:hidden}
.chead{display:flex;align-items:center;gap:7px;padding:11px 12px 8px}
.cname{font-weight:700;font-size:15px}
.ctag{font-size:11px;color:var(--dim);font-family:var(--num)}
.chead .sp{margin-right:auto}
.icobtn{background:none;border:1px solid var(--line);color:var(--dim);font-size:13px;cursor:pointer;
  padding:4px 8px;border-radius:9px;line-height:1.4}
.icobtn:hover{background:var(--panel2);color:var(--chalk)}
.icobtn.info{color:var(--brass);border-color:#4A3B18;font-weight:700}

.sugg{display:block;width:calc(100% - 18px);margin:0 9px 8px;background:rgba(214,163,68,.09);
  border:1px solid rgba(214,163,68,.35);color:var(--brass);border-radius:10px;padding:7px;
  font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.sugg:hover{background:rgba(214,163,68,.16)}
.sets{padding:0 9px 9px}
.row{display:grid;grid-template-columns:24px 1fr 1fr auto;gap:7px;align-items:center;
  padding:6px 3px;border-top:1px solid rgba(43,53,66,.6)}
.row:first-child{border-top:0}
.fld{position:relative}
.fld input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--chalk);
  font-family:var(--num);font-size:17px;font-weight:700;padding:9px 8px 9px 30px;text-align:right;outline:none;min-width:0}
.fld input:focus{border-color:var(--brass);background:#232C38}
.fld input::placeholder{color:#4E5A6B;font-weight:400}
.fld .unit{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--dim);pointer-events:none}
.ghost{font-size:10.5px;color:#6F7A8C;font-family:var(--num);white-space:nowrap;min-width:54px;text-align:left}
.ghost b{color:#A9B3C2;font-weight:700}
.badge{color:var(--up);font-weight:700;font-family:var(--ar)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.setbtns{display:flex;gap:6px;margin-top:5px}
.addset{flex:1;background:none;border:1px dashed var(--line);border-radius:10px;color:var(--dim);
  padding:7px;font-size:12px;cursor:pointer}
.addset.del{border-color:rgba(201,112,112,.4);color:#C08585}
.addset.del:hover{color:#E0A6A6;border-color:var(--down)}
.addset:hover{color:var(--chalk);border-color:var(--dim)}
.addex{width:100%;background:var(--panel);border:1px dashed var(--line);border-radius:var(--rad);color:var(--dim);
  padding:13px;font-size:13px;font-weight:700;cursor:pointer;margin:12px 0}
.addex:hover{color:var(--brass);border-color:var(--brass)}

/* rest timer */
#rest{position:fixed;bottom:58px;right:0;left:0;z-index:40;display:none}
#rest.on{display:block}
#rest .in{max-width:700px;margin:0 auto;padding:0 14px 8px}
#rest .bar{background:var(--panel2);border:1px solid var(--brass);border-radius:12px;
  display:flex;align-items:center;gap:10px;padding:9px 12px;position:relative;overflow:hidden}
#rest .prog{position:absolute;top:0;right:0;bottom:0;background:rgba(214,163,68,.14);transition:width 1s linear}
#rest .t{font-family:var(--num);font-size:22px;font-weight:700;position:relative}
#rest .lb{font-size:12px;color:var(--dim);position:relative}
#rest .acts{margin-right:auto;display:flex;gap:6px;position:relative}
#rest .acts button{background:var(--panel);border:1px solid var(--line);color:var(--chalk);
  border-radius:9px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}

/* progress + body */
.pbar{display:flex;align-items:center;gap:8px;margin:7px 0}
.pbar .nm{font-size:12px;color:var(--dim);min-width:44px;font-family:var(--num)}
.pbar .track{flex:1;height:9px;background:var(--panel2);border-radius:99px;overflow:hidden}
.pbar .fill{height:100%;background:linear-gradient(90deg,#8A6A21,var(--brass));border-radius:99px}
.pbar .v{font-family:var(--num);font-size:12px;color:var(--dim);min-width:56px;text-align:left}
.sel,.ta{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--chalk);
  font-family:var(--ar);font-size:14px;padding:10px;margin:6px 0 14px}
.ta{font-family:var(--num);font-size:11px;height:130px}
.empty{color:var(--dim);font-size:13px;padding:24px 4px;text-align:center}
h2.sec{font-size:13px;color:var(--dim);font-weight:700;margin:20px 0 4px;letter-spacing:.3px}
.btn{background:var(--brass);border:0;color:#171208;border-radius:11px;padding:11px 15px;
  font-size:13px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}
.btn.ghostb{background:var(--panel);color:var(--chalk);border:1px solid var(--line)}
.setrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin:8px 0}
.setrow .l{font-size:13.5px}
.setrow .c{margin-right:auto}
.sw{width:46px;height:26px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer}
.sw i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:99px;background:var(--dim);transition:.18s}
.sw.on{background:rgba(214,163,68,.35)} .sw.on i{right:23px;background:var(--brass)}
.num-s{width:74px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--chalk);
  font-family:var(--num);font-size:15px;font-weight:700;padding:7px;text-align:center;outline:none}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(6,9,13,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
  width:100%;max-width:700px;max-height:92vh;overflow-y:auto;padding:0 0 22px;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.shead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:14px 15px;z-index:2}
.shead .t{font-weight:900;font-size:16px}
.shead .x{margin-right:auto;background:var(--panel2);border:1px solid var(--line);color:var(--chalk);
  border-radius:9px;width:30px;height:30px;font-size:15px;cursor:pointer}
.sbody{padding:14px 15px}
.figs{display:flex;justify-content:center;gap:18px;background:var(--panel2);border-radius:12px;padding:12px 0;margin-bottom:14px}
.figs figure{margin:0;text-align:center}
.figs figcaption{font-size:10px;color:var(--dim);margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:11.5px;color:var(--dim)}
.chip b{color:var(--chalk);font-weight:700}
.gh{font-size:12px;color:var(--brass);font-weight:700;margin:14px 0 6px;letter-spacing:.3px}
ol.steps{margin:0;padding-right:20px;font-size:13.5px}
ol.steps li{margin-bottom:7px}
ul.mis{margin:0;padding:0;list-style:none;font-size:13px}
ul.mis li{position:relative;padding-right:20px;margin-bottom:7px;color:#DCC7C7}
ul.mis li:before{content:"✕";position:absolute;right:0;color:var(--down);font-size:11px;top:2px}
.ytb{display:block;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  padding:11px;color:var(--chalk);text-decoration:none;font-size:13px;font-weight:700;margin-top:16px}
.search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--chalk);
  font-family:var(--ar);font-size:14px;padding:11px;outline:none;margin-bottom:10px}
.pick{display:flex;align-items:center;gap:9px;width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:11px;padding:11px;margin-bottom:7px;cursor:pointer;text-align:right;color:var(--chalk)}
.pick:hover{border-color:var(--brass)}
.pick .n{font-size:13.5px;font-weight:700}
.pick .e{font-size:11px;color:var(--dim);margin-right:auto;font-family:var(--num)}

.chk{width:27px;height:27px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
  color:var(--dim);font-family:var(--num);font-size:12px;cursor:pointer;padding:0;line-height:1}
.chk.on{background:rgba(87,192,140,.18);border-color:var(--up);color:var(--up);font-weight:700}
.repeat{width:100%;background:rgba(214,163,68,.1);border:1px solid rgba(214,163,68,.4);color:var(--brass);
  border-radius:12px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;margin:10px 0 2px}
.repeat:hover{background:rgba(214,163,68,.18)}
.stall{display:block;width:calc(100% - 18px);margin:0 9px 8px;background:rgba(201,112,112,.1);
  border:1px solid rgba(201,112,112,.35);color:#E0A6A6;border-radius:10px;padding:8px 10px;
  font-size:11.5px;line-height:1.6;text-align:right}
.noteBox{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  color:var(--chalk);font-family:var(--ar);font-size:13px;padding:11px;outline:none;
  min-height:62px;margin:4px 0 10px;resize:vertical}
.noteBox:focus{border-color:var(--brass)}
.hrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin:7px 0;cursor:pointer;width:100%;text-align:right;color:var(--chalk)}
.hrow:hover{border-color:var(--brass)}
.hrow .d{font-family:var(--num);font-size:12px;color:var(--dim);min-width:52px}
.hrow .n{font-size:13px;font-weight:700}
.hrow .v{margin-right:auto;font-family:var(--num);font-size:11.5px;color:var(--dim)}
.seg{display:flex;gap:6px;margin:6px 0 14px}
.seg button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  border-radius:10px;padding:9px 4px;font-size:12.5px;font-weight:700;cursor:pointer}
.seg button.on{background:rgba(214,163,68,.14);border-color:var(--brass);color:var(--brass)}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.f{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.f label{display:block;font-size:11px;color:var(--dim);margin-bottom:2px}
.f input{width:100%;background:none;border:0;color:var(--chalk);font-family:var(--num);
  font-size:19px;font-weight:700;padding:0;outline:none}
.f input::placeholder{color:#4E5A6B;font-weight:400}
.f.calc{background:var(--panel2);border-style:dashed}
.f.calc .v{font-family:var(--num);font-size:19px;font-weight:700;color:var(--brass)}
.scan{width:100%;background:var(--panel);border:1px dashed var(--brass);border-radius:12px;
  color:var(--brass);padding:13px;font-size:13px;font-weight:700;cursor:pointer;margin:4px 0 6px}
.scan:disabled{opacity:.55;cursor:default}
.note{font-size:11.5px;color:var(--dim);line-height:1.7;margin:6px 2px 14px}
.warn{background:rgba(214,163,68,.08);border:1px solid rgba(214,163,68,.3);border-radius:11px;
  padding:10px 12px;font-size:12px;color:#D9C79C;line-height:1.7;margin:10px 0}
.mini{display:flex;gap:6px;margin:10px 0 4px}
.mini button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  border-radius:9px;padding:7px;font-size:11.5px;font-weight:700;cursor:pointer}
.mini button.on{color:var(--brass);border-color:var(--brass)}
nav{position:fixed;bottom:0;right:0;left:0;background:rgba(17,21,27,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:700px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;color:var(--dim);font-size:12px;font-weight:700;
  padding:13px 0;cursor:pointer;border-top:2px solid transparent}
nav button.on{color:var(--brass);border-top-color:var(--brass)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- focus mode ---- */
#focus{position:fixed;inset:0;z-index:70;background:var(--ink);display:none;
  flex-direction:column;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
#focus.on{display:flex}
.fbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--ink);z-index:3}
.fbar .nm{font-weight:900;font-size:16px;line-height:1.3}
.fbar .st{font-size:11px;color:var(--dim);font-family:var(--num)}
.fbar .sp{margin-right:auto}
.fdots{display:flex;gap:4px;padding:10px 14px 4px;flex-wrap:wrap}
.fdot{height:5px;flex:1;min-width:8px;border-radius:99px;background:var(--line)}
.fdot.done{background:var(--up)} .fdot.now{background:var(--brass)}
.fbody{padding:8px 14px 20px;max-width:560px;margin:0 auto;width:100%}
.ftarget{text-align:center;font-size:12.5px;color:var(--dim);margin:14px 0 6px;line-height:1.8}
.ftarget b{color:var(--brass);font-family:var(--num)}
.step{display:flex;align-items:stretch;gap:9px;margin:10px 0}
.step button{width:64px;background:var(--panel);border:1px solid var(--line);color:var(--chalk);
  border-radius:14px;font-size:26px;font-weight:700;cursor:pointer;line-height:1}
.step button:active{background:var(--panel2)}
.step .val{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  padding:12px 6px;text-align:center;cursor:pointer}
.step .val .n{font-family:var(--num);font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.step .val .u{font-size:10.5px;color:var(--dim);margin-top:2px}
.fdone{width:100%;background:var(--brass);border:0;color:#171208;border-radius:16px;padding:18px;
  font-size:17px;font-weight:900;cursor:pointer;margin-top:14px}
.fdone:active{opacity:.85}
.frow{display:flex;gap:8px;margin-top:10px}
.frow button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  border-radius:12px;padding:11px 6px;font-size:12px;font-weight:700;cursor:pointer}
.frow button.on{color:var(--brass);border-color:var(--brass)}
.fprev{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.fprev span{background:var(--panel);border:1px solid var(--line);border-radius:99px;
  padding:4px 10px;font-family:var(--num);font-size:11px;color:var(--dim)}
.fprev span.ok{color:var(--up);border-color:rgba(87,192,140,.4)}
.frest{position:fixed;inset:0;z-index:75;background:rgba(10,13,18,.96);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.frest.on{display:flex}
.frest .big{font-family:var(--num);font-size:74px;font-weight:700;letter-spacing:-3px;color:var(--brass)}
.frest .lb{font-size:13px;color:var(--dim)}
.frest .nx{font-size:14px;color:var(--chalk);text-align:center;line-height:1.7}
.frest .acts{display:flex;gap:8px;margin-top:6px}
.frest .acts button{background:var(--panel);border:1px solid var(--line);color:var(--chalk);
  border-radius:12px;padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer}
.frest .acts button.pri{background:var(--brass);border-color:var(--brass);color:#171208}
.ytwrap{margin:10px 0 4px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000;position:relative}
.ytshield{position:absolute;inset:0;background:transparent;display:none}
.ytshield.on{display:block}
.ytlockb{position:absolute;top:6px;left:6px;z-index:3;background:rgba(17,21,27,.85);border:1px solid var(--line);
  color:var(--chalk);border-radius:9px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer}
.ytlockb.on{border-color:var(--brass);color:var(--brass)}
.ytchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.ytchip{background:var(--panel);border:1px solid var(--line);color:var(--chalk);border-radius:99px;
  padding:6px 12px;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.ytchip.on{border-color:var(--brass);color:var(--brass)}
.ytchip b{font-weight:700}
.ytchip i{font-style:normal;color:#C08585;font-size:12px}
#ytzone{max-width:560px;margin:0 auto;width:100%;padding:0 14px}
.ytwrap iframe{display:block;width:100%;height:190px;border:0}
.ytfall{display:block;text-align:center;font-size:11.5px;color:var(--dim);text-decoration:none;padding:6px 0 2px}
.ytfall:hover{color:var(--brass)}
.ytbar{display:flex;gap:7px;margin:8px 0}
.ytbar input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--chalk);font-family:var(--ar);font-size:12px;padding:9px;outline:none}
.ytbar button{background:var(--panel);border:1px solid var(--line);color:var(--dim);
  border-radius:10px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer}
.fsum{text-align:center;padding:34px 14px}
.fsum .h{font-size:22px;font-weight:900;margin-bottom:6px}
.fsum .v{font-family:var(--num);font-size:46px;font-weight:700;color:var(--brass);letter-spacing:-2px}
.startf{width:100%;background:var(--brass);border:0;color:#171208;border-radius:13px;padding:14px;
  font-size:14px;font-weight:900;cursor:pointer;margin:10px 0 2px}
.editbtn{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--dim);

.row.rpe{grid-template-columns:24px 1fr 1fr 38px auto}

.rhint{font-size:11px;color:var(--dim);text-align:center;margin-top:4px;min-height:15px}

.eqgrid{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}

.showall{width:100%;background:none;border:1px dashed var(--line);color:var(--dim);

  window.localStorage.removeItem(t); return window.localStorage; }catch(e){ return null; } })();

function lsGet(k){ if(!LS) return mem[k]||null; try{ return LS.getItem(PFX+k); }catch(e){ return mem[k]||null; } }

  get:function(k){

/* a move is available when every requirement entry is satisfied by at least one owned item */
function eqOk(x){
  if(!cfg.eqOn||!x) return true;
  var req=x.eqk||[]; if(!req.length) return true;
  var have=cfg.eq||{};
  for(var i=0;i<req.length;i++){
    var any=req[i].split("|").some(function(k){ return !!have[k]; });
    if(!any) return false;
  }
  return true;
}
/* which requirements are missing, as readable Arabic */
function eqMissing(x){
  if(!x||!x.eqk) return [];
  var have=cfg.eq||{},out=[];
  x.eqk.forEach(function(g){
    var parts=g.split("|");
    if(parts.some(function(k){ return !!have[k]; })) return;
    out.push(parts.map(function(k){ return EQ[k]||k; }).join(" أو "));
  });
  return out;
}

/* ============ helpers ============ */
function day(){for(var i=0;i<plan.length;i++) if(plan[i].id===dayId) return plan[i]; return plan[0];}
function cur(){var k=key(dateStr,dayId); if(!sessions[k]) sessions[k]={}; return sessions[k];}
function prevSession(){
  var best=null,bd="";
  for(var k in sessions){
    var p=k.split("|"); if(p[0]!==dayId||p[1]>=dateStr) continue;
    var has=false,s=sessions[k];
    for(var e in s){ if(s[e]&&s[e].some(function(x){return x&&x.w;})){has=true;break;} }
    if(has&&p[1]>bd){bd=p[1];best=s;}
  }
  return best;
}
function volume(s){var v=0;for(var e in s){(s[e]||[]).forEach(function(x){if(x&&x.w&&x.r)v+=parseFloat(x.w)*parseFloat(x.r);});}return Math.round(v);}
function topRep(range){var m=String(range).match(/(\d+)\s*$/);return m?parseInt(m[1],10):12;}
function e1rm(w,r){ return Math.round(parseFloat(w)*(1+parseFloat(r)/30)*10)/10; }

/* ---- movements: a lift's history follows the lift itself, across programs and days ---- */
function mkey(ex){ return ex.ref?("m:"+ex.ref):("c:"+String(ex.n||"").trim()); }
function uidMov(uid){
  for(var i=0;i<plan.length;i++) for(var j=0;j<plan[i].ex.length;j++)
    if(plan[i].ex[j].uid===uid) return mkey(plan[i].ex[j]);
  var p=String(uid).split("_");           /* orphaned slot from an old program */
  if(p.length>1&&LIBMAP[p[1]]) return "m:"+p[1];
  return "u:"+uid;
}
function movName(mv){
  if(mv.indexOf("m:")===0&&LIBMAP[mv.slice(2)]) return LIBMAP[mv.slice(2)].n;
  return mv.slice(2)||"تمرين";
}
function movMuscles(mv){
  var a=(mv.indexOf("m:")===0)?LIBMAP[mv.slice(2)]:null; return a?a.m:[];
}
/* best set on every date this movement was performed */
function movHistory(mv){
  var by={};
  for(var k in sessions){
    var d=k.split("|")[1],s=sessions[k];
    for(var uid in s){
      if(uidMov(uid)!==mv) continue;
      (s[uid]||[]).forEach(function(x){
        if(!x||!x.w||!x.r) return;
        var w=parseFloat(x.w),e=e1rm(x.w,x.r);
        if(!by[d]) by[d]={d:d,w:0,r:"",e:0};
        if(w>by[d].w){ by[d].w=w; by[d].r=x.r; }
        if(e>by[d].e) by[d].e=e;
      });
    }
  }
  var a=[]; for(var dd in by) a.push(by[dd]);
  a.sort(function(x,y){return x.d<y.d?-1:1;});
  return a;
}
/* the most recent time this movement was performed before the selected date */
function lastSets(ex){
  var mv=mkey(ex),best=null,bd="";
  for(var k in sessions){
    var d=k.split("|")[1]; if(d>=dateStr) continue;
    var s=sessions[k];
    for(var uid in s){
      if(uidMov(uid)!==mv) continue;
      var rows=s[uid]||[];
      if(!rows.some(function(x){return x&&x.w;})) continue;
      if(d>bd){ bd=d; best=rows; }
    }
  }
  return best?{d:bd,sets:best}:null;
}
/* same top weight for 3 sessions running = stalled */
function stall(ex){
  var a=movHistory(mkey(ex)).filter(function(x){return x.d<=dateStr;}).slice(-3);
  if(a.length===3&&a[0].w===a[1].w&&a[1].w===a[2].w) return a[0].w;
  return null;
}
function musclesOf(uid){ return movMuscles(uidMov(uid)); }
/* sets per muscle over a chosen window ending on the selected date.
   days = 0 means the full history. primary muscle counts 1, assisting muscles 0.5 */
function muscleVolume(days){
  var end=new Date(dateStr+"T00:00:00"),out={},first=null,any=false;
  for(var k in sessions){
    var p=k.split("|"),d=new Date(p[1]+"T00:00:00");
    var diff=(end-d)/86400000;
    if(diff<0) continue;
    if(days&&diff>days-1) continue;
    var s=sessions[k],used=false;
    for(var uid in s){
      var n=(s[uid]||[]).filter(function(x){return x&&x.w&&x.r;}).length;
      if(!n) continue;
      used=true;
      musclesOf(uid).forEach(function(m,i){ out[m]=(out[m]||0)+n*(i===0?1:0.5); });
    }
    if(used){ any=true; if(first===null||diff>first) first=diff; }
  }
  /* never average over empty tail: if history is shorter than the window, use the history */
  var actual = any ? first+1 : 7;
  var span = Math.max(days ? Math.min(days,actual) : actual, 7);
  return {v:out,span:span,weeks:Math.max(span/7,1)};
}

/* progression: if last time all sets reached top of rep range at same weight -> add increment */
function lastBW(){ var ks=Object.keys(bw).sort(); return ks.length?bw[ks[ks.length-1]]:null; }
/* lean body mass, best available source */
function leanMass(){
  var b=lastBW(); if(!b||!b.w) return null;
  var w=parseFloat(b.w);
  if(b.f) return {v:w*(1-parseFloat(b.f)/100),src:"نسبة الدهون"};
  if(b.m) return {v:parseFloat(b.m)/0.54,src:"كتلة العضلات"};
  return {v:w*(cfg.sex==="f"?0.70:0.78),src:"الوزن فقط (تقديري)"};
}
function roundW(v){
  if(v>=20) return Math.round(v/2.5)*2.5;
  if(v>=10) return Math.round(v);
  return Math.round(v*2)/2;
}
function startWeight(ex){
  if(!ex.ref||COEF[ex.ref]===undefined) return null;
  var c=COEF[ex.ref]; if(!c) return {bw:true};
  var lm=leanMass(); if(!lm) return null;
  var k=(LEVELS[cfg.level]||LEVELS.beg).k;
  var sx=cfg.sex==="f" ? (UPPER[ex.ref]?0.60:0.75) : 1;
  var v=lm.v*c*k*sx;
  /* longer rep ranges mean lighter working weight */
  var top=topRep(ex.r);
  if(top>=15) v*=0.75; else if(top>=12) v*=0.85;
  return {w:roundW(v),est:true,per:!!PERDB[ex.ref]};
}
function suggest(ex){
  var last=lastSets(ex);
  if(!last) return startWeight(ex);
  var done=last.sets.filter(function(x){return x&&x.w&&x.r;});
  if(done.length<Math.max(2,ex.s-1)) return startWeight(ex);
  var w=Math.max.apply(null,done.map(function(x){return parseFloat(x.w);}));
  var top=topRep(ex.r);
  var hitAll=done.every(function(x){return parseFloat(x.r)>=top&&parseFloat(x.w)>=w;});
  var inc=exInc(ex);
  var rp=avgRpe(done);
  if(hitAll&&inc>0){
    /* effort decides the size of the jump, not just whether the range was completed */
    if(rp!=null&&rp>=9.5) return {w:w,up:false,hold:true,rpe:rp};
    if(rp!=null&&rp<=7)   return {w:Math.round((w+inc*2)*10)/10,up:true,big:true,rpe:rp};
    return {w:Math.round((w+inc)*10)/10,up:true,rpe:rp};
  }
  return {w:w,up:false,rpe:rp};
}
/* ---- perceived effort (RPE) ---- */
function avgRpe(rows){
  var v=(rows||[]).map(function(x){ return x&&x.p!=null?parseFloat(x.p):NaN; })
                  .filter(function(n){ return !isNaN(n); });
  if(!v.length) return null;
  var s=0; v.forEach(function(n){ s+=n; });
  return Math.round(s/v.length*10)/10;
}
var RPEV=[6,7,8,9,9.5,10];
var RPETXT={6:"سهل",7:"باقي ٣ عدات",8:"باقي عدتين",9:"باقي عدة",9.5:"باقي نصف عدة",10:"أقصى جهد"};

/* ---- warm-up ladder ---- */
/* the empty implement is the floor: no warm-up set can be lighter than it */
function eqFloor(ex){
  var m=meta(ex);
  if(PERDB[ex.ref]) return exInc(ex)||2;
  var k=(m&&m.eqk)?m.eqk.join("|"):"";
  if(/(^|\|)bar(\||$)/.test(k)) return 20;
  if(/(^|\|)smith(\||$)/.test(k)) return 15;
  if(/(^|\|)ez(\||$)/.test(k)) return 10;
  return exInc(ex)||2.5;
}
/* the weight the warm-up should build up to: today's heaviest, else the suggestion */
function workWeight(ex){
  var rows=cur()[ex.uid]||[],mx=0;
  rows.forEach(function(x){ if(x&&x.w&&parseFloat(x.w)>mx) mx=parseFloat(x.w); });
  if(mx) return mx;
  var sg=suggest(ex);
  return (sg&&sg.w)?parseFloat(sg.w):0;
}
function warmSets(ex){
  if(!cfg.warmOn||!ex) return [];
  if(ex.ref&&COEF[ex.ref]===0) return [];        /* وزن الجسم */
  var w=workWeight(ex); if(!w||w<=0) return [];
  var floor=eqFloor(ex),inc=exInc(ex)||2.5;
  if(w<=floor) return [];
  var steps=[[0.5,8],[0.7,5],[0.85,3]];
  /* عزل بنطاق عالٍ ما يحتاج سلّماً كاملاً — الدرجات تتبع ثقل التمرين لا الوزن وحده */
  var top=topRep(ex.r),max=top>=12?1:(top>=10?2:3);
  var out=[],prev=0;
  steps.forEach(function(p,i){
    if(i>=max) return;
    /* skip the middle and top rungs when the working weight is still light */
    if(i===1&&w<floor*2) return;
    if(i===2&&w<floor*2.5) return;
    var v=Math.max(floor,Math.round(w*p[0]/inc)*inc);
    v=Math.round(v*10)/10;
    if(v>=w||v<=prev) return;
    prev=v; out.push({w:v,r:p[1]});
  });
  return out;
}
function warmKey(){ return key(dateStr,dayId); }
function warmDone(uid){ var s=warm[warmKey()]; return (s&&s[uid])||[]; }
function warmToggle(uid,i){
  var k=warmKey(); if(!warm[k]) warm[k]={};
  var a=warm[k][uid]||[]; while(a.length<=i) a.push(false);
  a[i]=!a[i]; warm[k][uid]=a; saveW();
}
function warmHtml(ex,cls){
  var ws=warmSets(ex); if(!ws.length) return "";
  var dn=warmDone(ex.uid);
  return '<div class="'+(cls||"warmrow")+'"><span class="wl">تسخين</span>'+
    ws.map(function(x,i){
      return '<button class="wchip '+(dn[i]?"on":"")+'" data-wu="'+ex.uid+'" data-wi="'+i+'">'+
        (dn[i]?"✓ ":"")+x.w+' × '+x.r+'</button>';}).join("")+
    '<span class="wl2">لا تُحسب في الحمل</span></div>';
}
function bindWarm(root,after){
  root.querySelectorAll("[data-wu]").forEach(function(b){
    b.onclick=function(){ warmToggle(b.getAttribute("data-wu"),+b.getAttribute("data-wi")); after(); };});
}

    return '<button class="tab '+(d.id===dayId?"on":"")+'" data-d="'+d.id+'">'+esc(d.name)+'</button>';}).join("")+
    '<button class="tab" id="mgd" title="إدارة الأيام">⚙ الأيام</button>';
  Array.prototype.forEach.call($("tabs").querySelectorAll("[data-d]"),function(b){
    b.onclick=function(){dayId=b.getAttribute("data-d");view="log";render();window.scrollTo(0,0);};});
  $("mgd").onclick=dayMgr;
  $("tabs").style.display = view==="log" ? "flex" : "none";
  ["n1","n2","n3","n4"].forEach(function(id,i){
    $(id).className = (["log","prog","body","set"][i]===view)?"on":"";});
  if(view==="log") renderLog();
  else if(view==="prog") renderProg();
  else if(view==="body") renderBody();
  else renderSet();
}

function renderLog(){
  var d=day(),s=cur(),prev=prevSession(),vol=volume(s),pv=prev?volume(prev):0;
  var h='<div class="strip"><div class="big">'+vol.toLocaleString("en-US")+'</div>'+
        '<div class="lbl">كجم إجمالي حمل اليوم</div>';
  if(pv&&vol){var df=vol-pv,pc=Math.round(df/pv*100);
    h+='<div class="delta '+(df>=0?"up":"down")+'">'+(df>=0?"▲ ":"▼ ")+Math.abs(pc)+'٪ عن آخر مرة</div>';}
  h+='</div>';
  if(!editMode){
    h+='<button class="startf" id="startf">▶ وضع التركيز — سجّل بضغطتين وأنت تتمرن</button>';
    var anyPrev=d.ex.some(function(e){return !!lastSets(e);});
    if(anyPrev) h+='<button class="repeat" id="rep">↺ كرر آخر جلسة — عبّي كل الأوزان وعدّل اللي تغيّر</button>';
  }

  d.ex.forEach(function(ex,xi){
    var rows=s[ex.uid]||[],n=Math.max(ex.s,rows.length),body="";
    var lp=lastSets(ex);
    for(var i=0;i<n;i++){
      var r=rows[i]||{},p=lp&&lp.sets[i];
      var g=(p&&p.w)?(p.w+" × "+(p.r||"?")):"—";

/* remove one set from an exercise: drops its data and shrinks the planned count */
function delSet(xi,i){
  var ex=day().ex[xi]; if(!ex) return;
  var ss=cur(),rows=ss[ex.uid]||[];
  var n=Math.max(ex.s,rows.length);
  if(n<=1) return alert("لازم تبقى مجموعة واحدة على الأقل.");
  var v=rows[i];
  if(v&&(v.w||v.r)&&!confirm("حذف المجموعة "+(i+1)+"؟ فيها "+(v.w||"—")+" × "+(v.r||"—")+".")) return;
  if(i<rows.length) rows.splice(i,1);
  if(rows.length){ ss[ex.uid]=rows; } else { delete ss[ex.uid]; }
  ex.s=Math.max(1,Math.min(ex.s,n-1));
  saveP(); saveS(); renderLog();
}
function delSetQuiet(xi,i){
  var ex=day().ex[xi]; if(!ex) return;
  var ss=cur(),rows=ss[ex.uid]||[],n=Math.max(ex.s,rows.length);
  if(n<=1) return;
  if(i<rows.length) rows.splice(i,1);
  if(rows.length) ss[ex.uid]=rows; else delete ss[ex.uid];
  ex.s=Math.max(1,Math.min(ex.s,n-1));
  saveP(); saveS();
}
/* press and hold a set number to delete that specific set */
var holdFired=false;
function holdToDelete(el,fn){
  var t=null;
  function go(){ t=setTimeout(function(){ holdFired=true; fn(); },550); }
  function stop(){ if(t){clearTimeout(t);t=null;} }
  el.addEventListener("touchstart",go,{passive:true});
  ["touchend","touchmove","touchcancel"].forEach(function(e){ el.addEventListener(e,stop); });
  el.addEventListener("mousedown",go);
  ["mouseup","mouseleave"].forEach(function(e){ el.addEventListener(e,stop); });
}

function updStrip(){

  var d=document.querySelector(".strip .delta");
  if(d&&pv){var df=vol-pv,pc=Math.round(df/pv*100);
    d.className="delta "+(df>=0?"up":"down");
    d.textContent=(df>=0?"▲ ":"▼ ")+Math.abs(pc)+"٪ عن آخر مرة";}
}

/* pick any library move sharing a muscle with the current one */
function swapPicker(xi){
  var ex=day().ex[xi],m=meta(ex),mus=m?m.m:[];
  var cand=LIB.filter(function(x){ return x.id!==(m&&m.id)&&x.m.some(function(k){return mus.indexOf(k)>=0;}); });
  cand.sort(function(a,b){
    var sa=a.m.filter(function(k){return mus.indexOf(k)>=0;}).length;
    var sb=b.m.filter(function(k){return mus.indexOf(k)>=0;}).length;
    return sb-sa; });
  var h='<input class="search" id="sq" placeholder="ابحث…"><div id="sres"></div>';
  sheet("بديل لـ "+(m?m.n:exName(ex)),h);
  function draw(f){
    f=(f||"").trim();
    var items=(f?LIB:cand).filter(function(x){ return !f||x.n.indexOf(f)>=0||x.eq.indexOf(f)>=0||
      x.m.some(function(k){return (MNAMES[k]||"").indexOf(f)>=0;}); });
    $("sres").innerHTML=pickList(items,"data-sw2");
    $("sres").querySelectorAll("[data-sw2]").forEach(function(b){
      b.onclick=function(){ swapEx(xi,b.getAttribute("data-sw2")); };});
    if($("shall")) $("shall").onclick=function(){ eqShowAll=!eqShowAll; draw($("sq").value); };
  }
  draw("");
  $("sq").oninput=function(){ draw($("sq").value); };
}

function pickList(items,attr){
  var av=[],hid=[];
  items.forEach(function(x){ (eqOk(x)?av:hid).push(x); });
  var use=(cfg.eqOn&&!eqShowAll)?av:items;
  var h=use.length?use.map(function(x){
    var ok=eqOk(x);

/* ============ rest timer ============ */
var rt=null,rleft=0,rtotal=0,rEnd=0;
/* counts down against the system clock, so locking the screen doesn't freeze it */
function startRest(sec){
  rtotal=sec||cfg.rest; rEnd=Date.now()+rtotal*1000; rleft=rtotal;
  if(!(typeof F!=="undefined"&&F.on)) $("rest").classList.add("on");
  tick();
  clearInterval(rt);
  rt=setInterval(syncRest,250);
}
function syncRest(){
  if(!rEnd) return;
  var left=Math.ceil((rEnd-Date.now())/1000);
  if(left===rleft) return;
  rleft=left; tick();
  if(rleft<=0) endRest();
}
function tick(){
  var m=Math.floor(Math.max(rleft,0)/60),s=Math.max(rleft,0)%60;
  $("rtime").textContent=m+":"+pad(s);
  $("rprog").style.width=Math.max(0,Math.min(100,rleft/rtotal*100))+"%";
  if(window.__ftick) window.__ftick(rleft,rtotal);
}
function addRest(sec){
  if(!rEnd) return;
  rEnd+=sec*1000; rtotal+=sec;
  rleft=Math.ceil((rEnd-Date.now())/1000); tick();
}
function endRest(){
  clearInterval(rt); rEnd=0; $("rest").classList.remove("on");
  if(navigator.vibrate) try{navigator.vibrate([180,90,180]);}catch(e){}
  if(cfg.sound) beep();
  if(window.__fend) window.__fend();
}
function stopRest(){ clearInterval(rt); rEnd=0; $("rest").classList.remove("on"); }
/* re-sync the moment the screen or tab comes back */
document.addEventListener("visibilitychange",function(){ if(!document.hidden) syncRest(); });
window.addEventListener("focus",syncRest);
function beep(){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    var a=new C(),t=a.currentTime;
    [0,0.22,0.44].forEach(function(off){
      var o=a.createOscillator(),g=a.createGain();
      o.frequency.value=880; o.type="sine";
      g.gain.setValueAtTime(.0001,t+off);
      g.gain.exponentialRampToValueAtTime(.25,t+off+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+off+.18);
      o.connect(g); g.connect(a.destination); o.start(t+off); o.stop(t+off+.2);
    });
  }catch(e){}
}
$("rplus").onclick=function(){ addRest(30); };
$("rskip").onclick=function(){ stopRest(); };

/* ============ body composition ============ */
var bmetric="w";
function fatMass(e){ return (e.w&&e.f)?Math.round(e.w*e.f/100*10)/10:null; }
function leanOf(e){ var f=fatMass(e); return f!=null?Math.round((e.w-f)*10)/10:null; }
function metricVal(e,m){
  if(m==="w") return e.w!=null?parseFloat(e.w):null;
  if(m==="f") return fatMass(e);
  if(m==="m") return e.m!=null?parseFloat(e.m):leanOf(e);
  return null;
}

function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function lastBWDate(){ var ks=Object.keys(bw).sort(); return ks.length?ks[ks.length-1]:null; }
function bwAge(){ var d=lastBWDate(); return d?daysBetween(d,dateStr):null; }
function agoText(n){
  if(n==null) return "";
  if(n<=0) return "اليوم";
  if(n===1) return "أمس";
  if(n<14) return "قبل "+n+" يوم";
  if(n<60) return "قبل "+Math.round(n/7)+" أسابيع";
  return "قبل "+Math.round(n/30)+" شهور";
}
/* readings are weeks or months apart, so the x-axis follows real dates, not row order */
function bwChart(pts){
  if(pts.length<2) return '<div class="note">قراءة واحدة فقط — يحتاج قراءتين على الأقل لرسم الاتجاه.</div>';
  var t0=new Date(pts[0].d+"T00:00:00").getTime();
  var t1=new Date(pts[pts.length-1].d+"T00:00:00").getTime();
  var span=(t1-t0)||1;
  var vs=pts.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),rg=(mx-mn)||1;
  var W=320,H=132,PX=26,PY=18;
  function X(p){ return PX+((new Date(p.d+"T00:00:00").getTime()-t0)/span)*(W-PX*2); }
  function Y(p){ return PY+(1-(p.v-mn)/rg)*(H-PY*2); }
  var line=pts.map(function(p,i){ return (i?"L":"M")+X(p).toFixed(1)+" "+Y(p).toFixed(1); }).join(" ");
  var area=line+" L"+X(pts[pts.length-1]).toFixed(1)+" "+(H-PY)+" L"+X(pts[0]).toFixed(1)+" "+(H-PY)+" Z";
  var g='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="132" preserveAspectRatio="none">';
  g+='<line x1="'+PX+'" y1="'+PY+'" x2="'+(W-PX)+'" y2="'+PY+'" stroke="#2B3542" stroke-width="1"/>';
  g+='<line x1="'+PX+'" y1="'+(H-PY)+'" x2="'+(W-PX)+'" y2="'+(H-PY)+'" stroke="#2B3542" stroke-width="1"/>';
  g+='<path d="'+area+'" fill="rgba(214,163,68,.13)"/>';
  g+='<path d="'+line+'" fill="none" stroke="#D6A344" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){
    var last=(i===pts.length-1);
    g+='<circle cx="'+X(p).toFixed(1)+'" cy="'+Y(p).toFixed(1)+'" r="'+(last?4:2.8)+'" '+
       'fill="'+(last?"#D6A344":"#11151B")+'" stroke="#D6A344" stroke-width="1.6"/>';
  });
  g+='<text x="'+(W-PX)+'" y="12" fill="#8B94A5" font-size="9" text-anchor="end">'+mx+'</text>';
  g+='<text x="'+(W-PX)+'" y="'+(H-4)+'" fill="#8B94A5" font-size="9" text-anchor="end">'+mn+'</text>';
  g+='</svg>';
  return '<div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 4px 2px;margin:6px 0">'+g+
    '<div style="display:flex;justify-content:space-between;padding:0 8px 6px;font-family:var(--num);font-size:10px;color:var(--dim)">'+
    '<span>'+pts[0].d+'</span><span>'+Math.round(span/86400000)+' يوم</span><span>'+pts[pts.length-1].d+'</span></div></div>';
}

/* ---- read an InBody / smart-scale report ---- */
function readReport(file){
  var btn=$("scan"); btn.disabled=true; btn.textContent="جاري القراءة…";
  var fr=new FileReader();
  fr.onerror=function(){ btn.disabled=false; btn.textContent="📷 ارفع صورة تقرير InBody أو ملف"; alert("ما قدرت أقرأ الملف."); };
  fr.onload=function(){
    var b64=String(fr.result).split(",")[1];
    var isPdf=/pdf/i.test(file.type)||/\.pdf$/i.test(file.name);
    var mt=isPdf?"application/pdf":(file.type||"image/jpeg");
    var block= isPdf ? {type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}}
                     : {type:"image",source:{type:"base64",media_type:mt,data:b64}};
    var prompt="هذا تقرير تحليل تكوين الجسم (InBody أو ميزان ذكي). استخرج القيم وأعد JSON فقط بدون أي نص آخر وبدون علامات كود، بالمفاتيح التالية: "+
      '{"date":"YYYY-MM-DD أو null","weight":رقم كجم أو null,"fatPercent":رقم أو null,"muscleMass":رقم كجم أو null,"waist":رقم سم أو null}. '+
      "muscleMass هي كتلة العضلات الهيكلية SMM. حوّل الباوند إلى كيلو. لو القيمة غير موجودة ضع null.";
    fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,
        messages:[{role:"user",content:[block,{type:"text",text:prompt}]}]})
    }).then(function(r){return r.json();}).then(function(d){
      var txt=(d.content||[]).map(function(x){return x.text||"";}).join("").replace(/```json|```/g,"").trim();
      var o=JSON.parse(txt);
      btn.disabled=false; btn.textContent="📷 ارفع صورة تقرير InBody أو ملف";
      if(o.date&&/^\d{4}-\d{2}-\d{2}$/.test(o.date)){ dateStr=o.date; $("date").value=dateStr; renderBody(); }
      if(o.weight) $("bw_w").value=o.weight;
      if(o.fatPercent) $("bw_f").value=o.fatPercent;
      if(o.muscleMass) $("bw_m").value=o.muscleMass;
      if(o.waist) $("bw_c").value=o.waist;
      liveCalc();
      $("scanNote").textContent="تمت القراءة — راجع الأرقام واضغط حفظ القياس.";
      $("scanNote").style.color="var(--up)";
    }).catch(function(err){
      console.error(err);
      btn.disabled=false; btn.textContent="📷 ارفع صورة تقرير InBody أو ملف";
      $("scanNote").textContent="ما قدرت أقرأ التقرير هنا. الفحص التلقائي يشتغل داخل تطبيق Claude فقط — عبّي الخانات يدوياً.";
      $("scanNote").style.color="var(--down)";
    });
  };
  fr.readAsDataURL(file);
}

function applyTemplate(tid){

/* ============ export ============ */
function dayNameOf(id){ var n="—"; plan.forEach(function(d){ if(d.id===id) n=d.name; }); return n; }
function exNameByUid(uid){ return movName(uidMov(uid)); }
function allSessionKeys(){
  return Object.keys(sessions).filter(function(k){
    var s=sessions[k]; for(var u in s){ if((s[u]||[]).some(function(x){return x&&x.w;})) return true; }
    return false;
  }).sort(function(a,b){ return a.split("|")[1]<b.split("|")[1]?1:-1; });
}
function bestLifts(){
  var out={};
  for(var k in sessions){ var d=k.split("|")[1],s=sessions[k];
    for(var u in s){ var mv=uidMov(u);
      (s[u]||[]).forEach(function(x){
        if(!x||!x.w||!x.r) return;
        var w=parseFloat(x.w),e=e1rm(x.w,x.r);
        if(!out[mv]) out[mv]={w:w,r:x.r,d:d,e:e,n:movName(mv)};
        else{ if(w>out[mv].w){ out[mv].w=w; out[mv].r=x.r; out[mv].d=d; }
              if(e>out[mv].e) out[mv].e=e; }
      });
    }
  }
  return out;
}
function dl(name,mime,content){
  try{
    var b=new Blob(["\ufeff"+content],{type:mime+";charset=utf-8"});
    var u=URL.createObjectURL(b),a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },1500);
    return true;
  }catch(e){ console.error(e); return false; }
}
function tbl(title,head,rows){
  return '<table border="1"><tr><th colspan="'+head.length+'" style="background:#D6A344">'+title+'</th></tr>'+
    '<tr>'+head.map(function(h){return '<th style="background:#eee">'+esc(h)+'</th>';}).join("")+'</tr>'+
    rows.map(function(r){ return '<tr>'+r.map(function(c){
      return '<td>'+(c==null?"":esc(String(c)))+'</td>';}).join("")+'</tr>'; }).join("")+'</table>';
}
function exportXls(){
  var rows=[];
  allSessionKeys().slice().reverse().forEach(function(k){
    var p=k.split("|"),s=sessions[k];
    for(var u in s) (s[u]||[]).forEach(function(x,i){
      if(!x||!x.w) return;
      rows.push([p[1],dayNameOf(p[0]),exNameByUid(u),i+1,x.w,x.r||"",x.p!=null?x.p:"",x.d?"نعم":"",
        (x.w&&x.r)?e1rm(x.w,x.r):"",(x.w&&x.r)?Math.round(x.w*x.r):"",notes[k]||""]);
    });
  });
  var brows=Object.keys(bw).sort().map(function(k){
    var e=bw[k]; return [k,e.w||"",e.f||"",e.m||"",e.c||"",fatMass(e)||"",leanOf(e)||""];
  });
  var bl=bestLifts(),prows=Object.keys(bl).map(function(u){
    return [bl[u].n,bl[u].w,bl[u].r,bl[u].d,bl[u].e]; })

var F={on:false,xi:0,si:0,w:0,r:0,p:null,done:false};
function ytId(u){
  if(!u) return "";
  u=String(u).trim();
  var m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(u)) return u;
  return "";
}
/* accepts a video link, a playlist link, or a bare id */
function ytParse(u){
  u=String(u||"").trim(); if(!u) return {};
  var pl=u.match(/[?&]list=([A-Za-z0-9_-]+)/);
  var v=ytId(u);
  if(v) return {kind:"v",id:v,src:"https://www.youtube.com/embed/"+v+"?playsinline=1&rel=0"+(pl?"&list="+pl[1]:"")};
  if(pl) return {kind:"l",id:pl[1],src:"https://www.youtube.com/embed/videoseries?list="+pl[1]+"&playsinline=1"};
  if(/^PL[A-Za-z0-9_-]+$/.test(u)) return {kind:"l",id:u,src:"https://www.youtube.com/embed/videoseries?list="+u+"&playsinline=1"};
  return {};
}
/* opened straight off the disk: no origin, so YouTube refuses to embed (error 153) */
function isFileUrl(){ return location.protocol==="file:"; }
/* the plain watch link, for when the embed itself is blocked */
function ytWatch(p){
  if(!p||!p.id) return "https://www.youtube.com/";
  return p.kind==="l" ? "https://www.youtube.com/playlist?list="+p.id
                      : "https://www.youtube.com/watch?v="+p.id;
}

      '<br><a class="ytb" style="margin-top:10px" target="_blank" rel="noopener" href="'+esc(ytWatch(cu))+'">▶ افتح المقطع في يوتيوب الآن</a></div>';

    '<div style="font-size:12px;color:var(--dim);margin-top:4px">كجم إجمالي الحمل · '+sets+' مجموعة</div>'+
    '<button class="startf" id="fclose" style="margin-top:24px">إغلاق ورجوع للسجل</button>'+
    '<button class="fdone" id="fagain" style="background:var(--panel);color:var(--chalk);border:1px solid var(--line)">رجوع للتمارين</button></div>';
  $("fclose").onclick=exitFocus;
  $("fagain").onclick=function(){ F.done=false; F.xi=0; F.si=0; loadFocusVals(); drawFocus(); };
}
$("fx").onclick=exitFocus;
$("fg").onclick=function(){ var ex=day().ex[F.xi]; if(ex&&meta(ex)) guide(meta(ex),F.xi); };
$("fp30").onclick=function(){ addRest(30); };
$("fskip").onclick=function(){ stopRest(); $("frest").classList.remove("on"); advance(true); };

/* ============ nav ============ */
$("date").onchange=function(){ dateStr=$("date").value||dateStr; render(); };
$("n1").onclick=function(){view="log";render();window.scrollTo(0,0);};
$("n2").onclick=function(){view="prog";render();window.scrollTo(0,0);};
$("n3").onclick=function(){view="body";render();window.scrollTo(0,0);};
$("n4").onclick=function(){view="set";render();window.scrollTo(0,0);};

boot();

/* ============ PWA ============ */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(e){ console.log("SW:",e); });
  });
}
/* a link shared from the YouTube app lands here as ?url=… (Android, installed app) */
(function(){
  try{
    var q=new URLSearchParams(location.search);
    var shared=q.get("url")||q.get("text")||q.get("title");
    if(shared&&ytParse(shared).src){
      store.get("cfg").then(function(raw){
        var c={}; try{ c=JSON.parse(raw)||{}; }catch(e){}
        var l=c.ytList||[];
        var seen=false; l.forEach(function(x){ if(x.u===shared) seen=true; });
        if(!seen) l.unshift({t:"من المشاركة",u:shared});
        c.ytList=l.slice(0,8); c.yt=shared; c.ytShow=true; c.ytLock=false;
        store.set("cfg",JSON.stringify(c)).then(function(){
          cfg=Object.assign(cfg,c);
          history.replaceState(null,"",location.pathname);
          if(!F.on) startFocus(); else drawFocus();
        });
      });
    }
  }catch(e){}
})();
/* offer installation from the settings tab */
var deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault(); deferredPrompt=e;
  if(view==="set") renderSet();
});
window.canInstall=function(){ return !!deferredPrompt; };
window.doInstall=function(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(){ deferredPrompt=null; if(view==="set") renderSet(); });
};
})();
</script>
